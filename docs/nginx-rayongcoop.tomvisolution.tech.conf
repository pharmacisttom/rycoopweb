server {
    listen 80;
    listen [::]:80;
    server_name rayongcoop.tomvisolution.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rayongcoop.tomvisolution.tech;
    root /var/www/rayongcoop/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/rayongcoop.tomvisolution.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rayongcoop.tomvisolution.tech/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / { try_files /app/index.html =404; }
    location ^~ /api/ { try_files $uri /index.php?$query_string; }
    location ~ ^/(csrf-token|login|logout|change-password|verify-receipt)$ {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /storage/uploads/ {
        alias /var/www/rayongcoop/storage/uploads/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        location ~* \.(?:php|phtml|phar)$ { deny all; }
    }
    location ^~ /storage/backups/ { deny all; }
    location ~ (^|/)\.(?!well-known/) { deny all; }
    location ~* \.(?:env|ini|log|sql|bak)$ { deny all; }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
    }

    location ~* ^/(?:app/)?assets/.*\.(?:css|js|jpg|jpeg|png|gif|webp|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /app/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }
    location / { try_files $uri /app/index.html; }
}
