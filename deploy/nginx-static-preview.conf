# Dedicated HTTP preview server. It must not share a PHP document root.
server {
    listen 80;
    server_name 119.59.116.32;
    root /var/www/rycoop-preview/main;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    location ~ /\. { return 404; }
    location ~* \.(?:php|env|sql|bak|ini|log)$ { return 404; }
    location ~ ^/(?:test/)?(?:api|admin|member|staff|login|logout|csrf-token|change-password)(?:/|$) { return 403; }
    location ~* ^/test/.*\.(?:js|css|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|pdf|xlsx|csv)$ {
        root /var/www/rycoop-preview;
        try_files $uri =404;
        expires 1h;
    }
    location ~* \.(?:js|css|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|pdf|xlsx|csv)$ {
        try_files $uri =404;
        expires 1h;
    }
    location = /test { return 301 /test/; }
    location /test/ { root /var/www/rycoop-preview; try_files $uri $uri/ /test/index.html; }
    location / { try_files $uri $uri/ /index.html; }
}
