name: RYCOOPWEB Full Source Lint Audit
on:
  pull_request:
    paths:
      - 'app/**'
      - 'config/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'public/**'
      - 'database/**'
      - 'package.json'
      - 'package-lock.json'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/full-source-lint-audit.yml'
  workflow_dispatch:
jobs:
  full-source-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Run full source lint
        id: lint
        run: bash scripts/lint-all-source.sh
      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rycoopweb-full-source-lint
          path: /var/tmp/rycoop-lint-*/
          retention-days: 14
          if-no-files-found: warn
