name: Production SSH connection preflight (READ ONLY)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rycoop-production-ssh-preflight
  cancel-in-progress: false

jobs:
  connection-check:
    name: Connect to the RYCOOP VPS without changing it
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Check required SSH secrets
        shell: bash
        env:
          SSH_HOST: ${{ secrets.RYCOOP_SSH_HOST }}
          SSH_USER: ${{ secrets.RYCOOP_SSH_USER }}
          SSH_KEY: ${{ secrets.RYCOOP_SSH_PRIVATE_KEY }}
          SSH_HOST_KEYS: ${{ secrets.RYCOOP_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST" || { echo "Missing RYCOOP_SSH_HOST"; exit 1; }
          test -n "$SSH_USER" || { echo "Missing RYCOOP_SSH_USER"; exit 1; }
          test -n "$SSH_KEY" || { echo "Missing RYCOOP_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$SSH_HOST_KEYS" || { echo "Missing RYCOOP_SSH_KNOWN_HOSTS"; exit 1; }
          echo "Required SSH secrets supplied."
      - name: Read-only SSH preflight
        env:
          SSH_HOST: ${{ secrets.RYCOOP_SSH_HOST }}
          SSH_PORT: ${{ secrets.RYCOOP_SSH_PORT }}
          SSH_USER: ${{ secrets.RYCOOP_SSH_USER }}
          SSH_KEY: ${{ secrets.RYCOOP_SSH_PRIVATE_KEY }}
          SSH_HOST_KEYS: ${{ secrets.RYCOOP_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f scripts/production-ssh-readonly-preflight.sh
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          KEYFILE="$RUNNER_TEMP/ssh/id_ed25519"
          KNOWN="$RUNNER_TEMP/ssh/known_hosts"
          # Normalize Windows CRLF text when secret is pasted from PowerShell.
          # Never echo the key, its content, or its derived public key to logs.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$KEYFILE"
          printf '%s\n' "$SSH_HOST_KEYS" | tr -d '\r' > "$KNOWN"
          chmod 600 "$KEYFILE" "$KNOWN"
          if ! ssh-keygen -y -P '' -f "$KEYFILE" >/dev/null 2>&1; then
            echo "Invalid or encrypted RYCOOP_SSH_PRIVATE_KEY. Re-upload the full unencrypted OpenSSH private key, preserving its line breaks."
            exit 1
          fi
          echo "SSH private key format: PASS"
          PORT="${SSH_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]+$ ]] && ((PORT>=1 && PORT<=65535))
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.:-]+$ ]]
          ssh -T -p "$PORT" -i "$KEYFILE" \
            -o BatchMode=yes -o ConnectTimeout=12 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN" \
            "$SSH_USER@$SSH_HOST" 'bash -se' < scripts/production-ssh-readonly-preflight.sh
          rm -f "$KEYFILE" "$KNOWN"
